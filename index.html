<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* System: type 13/15/20/40 · bg + surface only · 16px rhythm · section headers = small-caps label + rule */
:root {
  --bg: oklch(0.17 0.01 260); --surface: oklch(0.22 0.012 260); --line: oklch(0.32 0.012 260);
  --ink: oklch(0.95 0.005 260); --dim: oklch(0.68 0.01 260);
  --accent: oklch(0.64 0.21 27); --up: oklch(0.76 0.17 150); --down: oklch(0.68 0.2 25);
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.45 "Bricolage Grotesque", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
h1 { font-weight: 800; font-size: 40px; line-height: 1; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.total { text-align: right; }
.total b { display: block; font: 600 32px var(--mono); }
.num { font-family: var(--mono); }
.small { font-size: 13px; color: var(--dim); }
nav { display: flex; gap: 4px; margin: 16px 0; }
nav button { background: none; border: 0; color: var(--dim); font: inherit; font-weight: 800; padding: 10px 14px; min-height: 44px; cursor: pointer; border-bottom: 2px solid transparent; }
nav button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); display: flex; gap: 12px; align-items: center; margin: 24px 0 12px; }
.label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
form { display: flex; flex-wrap: wrap; gap: 8px; }
input { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 10px 12px; min-height: 44px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
form input[list] { flex: 1 1 320px; }
.btn { background: var(--accent); color: white; border: 0; border-radius: 6px; font: inherit; font-weight: 800; padding: 10px 18px; min-height: 44px; cursor: pointer; }
.ghost { background: none; border: 1px solid var(--line); color: var(--dim); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.item { background: var(--surface); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
.item img { width: 72px; border-radius: 4px; background: var(--bg); }
.item h3 { font-size: 15px; margin: 0 0 2px; text-wrap: pretty; }
.item h3 a { color: inherit; text-decoration: none; }
.price { font: 600 20px var(--mono); margin-top: 6px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.row input { width: 96px; min-height: 36px; padding: 6px 8px; font-family: var(--mono); font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); }
.x { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; font-size: 13px; text-decoration: underline; padding: 8px 0; }
.rel { background: var(--surface); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 56px 1fr; gap: 16px; margin-bottom: 12px; }
.rel img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
.rel h3 { margin: 0; font-size: 18px; }
.rel h3 a { color: inherit; }
.date { font: 600 13px var(--mono); color: var(--accent); }
.empty { color: var(--dim); padding: 24px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pokémon<span>.</span>Tracker</h1>
    <div class="total"><span class="small">Collection value (AUD)</span><b id="total">–</b><span class="small" id="updated"></span></div>
  </header>

  <nav role="tablist">
    <button role="tab" data-tab="cards" aria-selected="true">Cards</button>
    <button role="tab" data-tab="sealed">Sealed</button>
    <button role="tab" data-tab="upcoming">Upcoming</button>
  </nav>

  <section id="cards">
    <form data-kind="card">
      <input list="card-list" placeholder="Search 30th Celebration cards, e.g. Pikachu ex 053" aria-label="Card" required>
      <datalist id="card-list"></datalist>
      <button class="btn">Add card</button>
    </form>
    <div class="label">My cards</div>
    <div class="grid" id="card-grid"></div>
  </section>

  <section id="sealed" hidden>
    <form data-kind="sealed">
      <input list="sealed-list" placeholder="Search packs, boxes, bundles, ETBs, tins…" aria-label="Sealed product" required>
      <datalist id="sealed-list"></datalist>
      <button class="btn">Add sealed</button>
    </form>
    <div class="label">My sealed</div>
    <div class="grid" id="sealed-grid"></div>
  </section>

  <section id="upcoming" hidden>
    <div class="label">Upcoming releases · Australia</div>
    <div id="rel-list"></div>
    <p class="small">Dates from <a href="https://cardtracker.au/releases" style="color:inherit">cardtracker.au</a> · checked <span id="rel-updated"></span></p>
  </section>

  <div class="label">Backup</div>
  <div class="row">
    <button class="btn ghost" id="export">Export collection</button>
    <label class="btn ghost">Import<input type="file" accept=".json" id="import" hidden></label>
    <span class="small">Your collection is saved in this browser. Prices: TCGplayer market (USD) converted to AUD.</span>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const aud = n => n == null ? "–" : n.toLocaleString("en-AU", { style: "currency", currency: "AUD" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let fx, byKey = {};
let mine = (() => { try { return JSON.parse(localStorage.collection) || null; } catch { return null; } })();
const save = () => { try { localStorage.collection = JSON.stringify(mine); } catch {} render(); };

// one option per product+variant; the datalist value is the human label, mapped back via byKey
function options(list, kind) {
  return list.flatMap(p => {
    const variants = Object.keys(p.prices).length ? Object.keys(p.prices) : [""];
    return variants.map(v => {
      const label = kind === "card"
        ? `${p.name}${v && v !== "Normal" ? " · " + v : ""} · ${p.rarity}`
        : `${p.name} — ${p.set}`;
      byKey[label] = { kind, id: p.id, variant: v };
      byKey[`${kind}|${p.id}|${v}`] = p;
      return `<option value="${esc(label)}">`;
    });
  }).join("");
}

const priceOf = it => { const p = byKey[`${it.kind}|${it.id}|${it.variant}`]; const usd = p?.prices[it.variant] ?? Object.values(p?.prices || {})[0]; return usd == null ? null : usd * fx; };
const pct = (a, b) => b ? ((a - b) / b * 100).toFixed(1) + "%" : "";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";

function tile(it, i) {
  const p = byKey[`${it.kind}|${it.id}|${it.variant}`];
  if (!p) return "";
  const each = priceOf(it), value = each == null ? null : each * it.qty;
  let extra = "";
  if (it.kind === "sealed") {
    const cost = it.msrp ? it.msrp * it.qty : null, profit = value != null && cost ? value - cost : null;
    extra = `<div class="row"><label class="small">MSRP each <input type="number" step="0.01" min="0" value="${it.msrp ?? ""}" data-i="${i}" data-f="msrp" placeholder="AUD"></label></div>
      ${profit == null ? `<div class="small">Enter MSRP to see return</div>`
        : `<div class="num ${cls(profit)}">${profit >= 0 ? "+" : ""}${aud(profit)} · ${pct(value, cost)}</div>`}`;
  } else if (it.addedAud && each != null) {
    extra = `<div class="small num ${cls(each - it.addedAud)}">${pct(each, it.addedAud) || "0.0%"} since added (${aud(it.addedAud)})</div>`;
  }
  return `<article class="item">
    <img src="${esc(p.img)}" alt="" loading="lazy">
    <div>
      <h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></h3>
      <div class="small">${esc(it.kind === "card" ? [it.variant, p.rarity].filter(Boolean).join(" · ") : p.set)}</div>
      <div class="price">${aud(value)}</div>
      <div class="small num">${aud(each)} each</div>
      ${extra}
      <div class="row"><label class="small">Qty <input type="number" min="1" value="${it.qty}" data-i="${i}" data-f="qty"></label>
      <button class="x" data-del="${i}">Remove</button></div>
    </div></article>`;
}

function render() {
  for (const kind of ["card", "sealed"]) {
    const html = mine.map((it, i) => it.kind === kind ? tile(it, i) : "").join("");
    $(`#${kind}-grid`).innerHTML = html || `<p class="empty">Nothing here yet. Search above to add one.</p>`;
  }
  $("#total").textContent = aud(mine.reduce((s, it) => s + (priceOf(it) ?? 0) * it.qty, 0));
}

document.querySelectorAll("form").forEach(f => f.onsubmit = e => {
  e.preventDefault();
  const input = f.querySelector("input"), hit = byKey[input.value];
  if (!hit) { input.setCustomValidity("Pick an item from the list"); input.reportValidity(); return; }
  mine.push({ ...hit, qty: 1, addedAud: priceOf(hit) });
  input.value = ""; save();
});
document.querySelectorAll("form input").forEach(i => i.oninput = () => i.setCustomValidity(""));
document.addEventListener("change", e => {
  const { i, f } = e.target.dataset;
  if (f) { mine[i][f] = f === "qty" ? Math.max(1, +e.target.value || 1) : (+e.target.value || null); save(); }
});
document.addEventListener("click", e => {
  if (e.target.dataset.del) { mine.splice(+e.target.dataset.del, 1); save(); }
  const tab = e.target.dataset.tab;
  if (tab) {
    document.querySelectorAll("[role=tab]").forEach(b => b.setAttribute("aria-selected", b === e.target));
    for (const s of ["cards", "sealed", "upcoming"]) $("#" + s).hidden = s !== tab;
  }
});
$("#export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(mine, null, 1)], { type: "application/json" }));
  a.download = "pokemon-collection.json"; a.click();
};
$("#import").onchange = async e => {
  try { const d = JSON.parse(await e.target.files[0].text()); if (Array.isArray(d)) { mine = d; save(); } } catch { alert("That file isn't a collection export."); }
};

(async () => {
  const [prices, rel] = await Promise.all(["data/prices.json", "data/releases.json"].map(u => fetch(u, { cache: "no-cache" }).then(r => r.json())));
  fx = prices.usdToAud;
  $("#card-list").innerHTML = options(prices.cards.sort((a, b) => a.number.localeCompare(b.number)), "card");
  $("#sealed-list").innerHTML = options(prices.sealed, "sealed");
  // first visit: start with the 30th Celebration Booster Bundle
  mine ??= prices.sealed.filter(p => p.name === "30th Celebration Booster Bundle").map(p => ({ kind: "sealed", id: p.id, variant: "Normal", qty: 1, addedAud: p.prices.Normal * fx }));
  $("#updated").textContent = `Prices updated ${new Date(prices.updated).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" })} · 1 USD = ${fx} AUD`;
  $("#rel-updated").textContent = new Date(rel.updated).toLocaleDateString("en-AU", { dateStyle: "medium" });
  $("#rel-list").innerHTML = rel.releases.map(r => `<article class="rel">
    <img src="${esc(r.img)}" alt="" loading="lazy">
    <div><div class="date">${esc(r.date)}</div><h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
    <div class="small">${esc(r.tags.join(" · "))}</div>
    ${r.products ? `<p>${esc(r.products)}</p>` : ""}${r.note ? `<p class="small">${esc(r.note)}</p>` : ""}</div></article>`).join("");
  save();
})();
</script>
</body>
</html>
